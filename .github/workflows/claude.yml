name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      github.actor == 'myfirnanda' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.label.name == 'claude-implement')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: 👀 React to trigger
        if: github.event.comment.id || github.event.review.id
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const commentId = context.payload.comment?.id;
            const reviewId = context.payload.review?.id;
            const prNumber = context.payload.pull_request?.number;
            if (commentId && context.eventName === 'issue_comment') {
              await github.rest.reactions.createForIssueComment({
                owner, repo, comment_id: commentId, content: 'eyes'
              });
            } else if (commentId && context.eventName === 'pull_request_review_comment') {
              await github.rest.reactions.createForPullRequestReviewComment({
                owner, repo, comment_id: commentId, content: 'eyes'
              });
            } else if (reviewId && prNumber) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: '👀 Mengerjakan...'
              });
            }

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, sqlite, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP deps
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS deps
        run: npm ci

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude binary
        run: |
          ls -la "$HOME/.local/bin/claude"
          "$HOME/.local/bin/claude" --version

      - name: Run Claude Code Action
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          label_trigger: "claude-implement"
          claude_args: |
            --max-turns 40
            --allowed-tools "Bash(./vendor/bin/pest:*),Bash(./vendor/bin/pint:*),Bash(./vendor/bin/phpstan:*),Bash(npm ci:*),Bash(npm run build:*),Bash(npm run lint),Bash(npx tsc --noEmit),Bash(php artisan:*),Bash(git:*),Edit,Write,Read,Glob,Grep"

      - name: ❌ Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = ${{ env.ISSUE_NUMBER }};
            if (!issue_number) return;
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: [
                '❌ **Workflow Claude gagal**',
                '',
                `Run: [#${context.runNumber}](${process.env.RUN_URL})`,
                '',
                'Buka link di atas untuk lihat log error. Setelah penyebabnya diperbaiki, panggil ulang dengan `@claude` atau tambah label `claude-implement` lagi.',
              ].join('\n')
            });
            // also react ✗ on the trigger comment if applicable
            const commentId = context.payload.comment?.id;
            if (commentId && context.eventName === 'issue_comment') {
              await github.rest.reactions.createForIssueComment({
                owner, repo, comment_id: commentId, content: 'confused'
              });
            }

      - name: ✅ React on success
        if: success() && (github.event.comment.id)
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const commentId = context.payload.comment.id;
            if (context.eventName === 'issue_comment') {
              await github.rest.reactions.createForIssueComment({
                owner, repo, comment_id: commentId, content: 'rocket'
              });
            } else if (context.eventName === 'pull_request_review_comment') {
              await github.rest.reactions.createForPullRequestReviewComment({
                owner, repo, comment_id: commentId, content: 'rocket'
              });
            }
