name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint frontend (ESLint)
        run: npx eslint .

      - name: Type-check (tsc)
        run: npm run types

      - name: Build assets
        run: npm run build

      - name: Quality gate (Pint, PHPStan, Pest)
        run: composer check

  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $PR_TITLE"
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|chore|docs|ci|refactor|test|perf|build)(\(.+\))?!?: .+'; then
            echo "✗ PR title must follow Conventional Commits (it becomes the squash commit on main)."
            echo "  Format: <type>(optional scope): summary"
            echo "  types: feat fix chore docs ci refactor test perf build"
            exit 1
          fi
          echo "✓ PR title OK"
